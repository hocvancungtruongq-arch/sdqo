  <script>
    const map = L.map('map').setView([20.9944, 105.6401], 14);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    L.marker([20.9944, 105.6401]).addTo(map).bindPopup("<b>UBND Huyện Quốc Oai</b>");
